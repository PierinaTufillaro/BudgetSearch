{% extends "base.html" %}

{% block content %}
  <form method="post" novalidate style="max-width: 400px;">
    <div class="mb-3">
      <label for="contrasena" class="form-label">Contraseña</label>
      <div class="input-group">
        <input type="password" name="contrasena" id="contrasena" class="form-control" required autofocus>
        <button type="button" class="btn btn-outline-secondary" id="togglePassword" style="border-left: 0;">
          <i class="bi bi-eye" id="eyeIcon"></i>
        </button>
      </div>
      {% if error %}
      <div class="text-danger mt-1" style="font-size: 0.9rem;">{{ error }}</div>
      {% endif %}
    </div>
    <button type="submit" class="btn btn-primary">Ingresar</button>
  </form>

  <script>
    document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordInput = document.getElementById('contrasena');
      const eyeIcon = document.getElementById('eyeIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.classList.remove('bi-eye');
        eyeIcon.classList.add('bi-eye-slash');
      } else {
        passwordInput.type = 'password';
        eyeIcon.classList.remove('bi-eye-slash');
        eyeIcon.classList.add('bi-eye');
      }
    });
  </script>
{% endblock %}
