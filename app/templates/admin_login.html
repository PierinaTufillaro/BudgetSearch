{% extends "base.html" %}

{% block content %}
  <form method="post" novalidate>
    <div class="mb-3" style="max-width: 300px;">
      <label for="username" class="form-label">Usuario</label>
      <input type="text" name="username" id="username" class="form-control" required autofocus>
    </div>
    <div class="mb-3" style="max-width: 300px;">
      <label for="password" class="form-label">Contraseña</label>
      <div class="input-group">
        <input type="password" name="password" id="password" class="form-control" required>
        <button type="button" class="btn btn-outline-secondary" id="togglePassword" style="border-left: 0;">
          <i class="bi bi-eye" id="eyeIcon"></i>
        </button>
      </div>
      {% if error %}
      <div class="text-danger mt-1" style="font-size: 0.9rem;">{{ error }}</div>
      {% endif %}
    </div>
    <a href="{{ url_for('auth.client_login') }}" class="btn btn-outline-secondary">Atrás</a>
    <button type="submit" class="btn btn-primary">Entrar</button>
  </form>

  <script>
    document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.classList.remove('bi-eye');
        eyeIcon.classList.add('bi-eye-slash');
      } else {
        passwordInput.type = 'password';
        eyeIcon.classList.remove('bi-eye-slash');
        eyeIcon.classList.add('bi-eye');
      }
    });
  </script>
{% endblock %}
